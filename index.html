<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#101428" />
  <title>Hello, World! — A Little Spark</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f7f7ff;
      --muted: #a9aecb;
      --glow: #9c8cff;
      --mint: #78f0cb;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 50% 110%, #33275c 0, transparent 48%),
        radial-gradient(ellipse at 8% 12%, #182d4d 0, transparent 38%),
        #101428;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body::before, body::after {
      position: fixed;
      width: 22rem;
      height: 22rem;
      border-radius: 50%;
      content: "";
      filter: blur(90px);
      opacity: .25;
      pointer-events: none;
      animation: drift 12s ease-in-out infinite alternate;
    }
    body::before { top: -10rem; right: -6rem; background: #7d65ff; }
    body::after { bottom: -14rem; left: -7rem; background: #36d9bd; animation-delay: -5s; }
    .stars {
      position: fixed;
      inset: 0;
      background-image: radial-gradient(1px 1px at 18% 24%, #fff 98%, transparent), radial-gradient(1px 1px at 73% 17%, #fff 98%, transparent), radial-gradient(1.5px 1.5px at 84% 64%, #d6d2ff 98%, transparent), radial-gradient(1px 1px at 31% 78%, #fff 98%, transparent), radial-gradient(1px 1px at 58% 89%, #fff 98%, transparent), radial-gradient(1px 1px at 92% 37%, #fff 98%, transparent);
      opacity: .55;
      pointer-events: none;
    }
    main {
      position: relative;
      width: min(680px, calc(100% - 36px));
      padding: clamp(2.5rem, 8vw, 5.5rem) clamp(1.5rem, 7vw, 4.5rem);
      text-align: center;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 32px;
      background: linear-gradient(145deg, rgba(255,255,255,.095), rgba(255,255,255,.025));
      box-shadow: 0 30px 100px rgba(0,0,0,.35), inset 0 1px rgba(255,255,255,.12);
      backdrop-filter: blur(18px);
      animation: arrive .9s cubic-bezier(.2,.8,.2,1) both;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: .55rem;
      margin-bottom: 1.8rem;
      color: var(--mint);
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .2em;
      text-transform: uppercase;
    }
    .eyebrow::before { width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 14px currentColor; content: ""; }
    h1 {
      margin: 0;
      font-size: clamp(3.6rem, 11vw, 7rem);
      line-height: .98;
      letter-spacing: -.075em;
      font-weight: 750;
    }
    h1 span {
      display: block;
      background: linear-gradient(100deg, #fff 8%, #c9c0ff 48%, #83f1d2 92%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    p {
      max-width: 390px;
      margin: 1.7rem auto 0;
      color: var(--muted);
      font-size: clamp(1rem, 2.5vw, 1.12rem);
      line-height: 1.75;
    }
    .spark {
      display: inline-block;
      margin-top: 2rem;
      color: #ffd98d;
      font-size: 1.4rem;
      filter: drop-shadow(0 0 12px rgba(255,217,141,.6));
      animation: twinkle 2.4s ease-in-out infinite;
    }
    footer {
      position: fixed;
      bottom: 1.5rem;
      color: rgba(220,224,255,.45);
      font-size: .72rem;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    @keyframes arrive { from { opacity: 0; transform: translateY(18px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes drift { to { transform: translate(35px, 25px) scale(1.12); } }
    @keyframes twinkle { 50% { transform: scale(1.2) rotate(12deg); opacity: .75; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
  </style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <main>
    <div class="eyebrow">A little beginning</div>
    <h1>Hello,<span>World!</span></h1>
    <p>One small line of code, one whole universe of possibility. Here's to whatever you build next.</p>
    <div class="spark" aria-hidden="true">✦</div>
  </main>
  <footer>Made with a little bit of wonder</footer>
</body>
</html>
